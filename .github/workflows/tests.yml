name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install layer dependencies for unit tests
        run: npm ci --prefix layers/layer1/nodejs

      - name: Run tests
        run: npm test

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Build SAM application
        run: npm run build

      - name: Verify layer dependencies are included
        run: node -e "require('./.aws-sam/build/CommonLayer/nodejs/common.js')"

      - name: Invoke Func1 in the Lambda runtime
        run: sam local invoke Func1 --event events/event.json

      - name: Invoke Func2 with the built layer
        run: sam local invoke Func2 --event events/event.json
